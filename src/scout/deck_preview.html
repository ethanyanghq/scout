<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity deck preview</title>
<style>
  :root { --blue: #2B2EF3; --gray: #A1A1AA; --swipe-distance: 90px; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #2a2f3a; font: 16px -apple-system, system-ui, sans-serif; color: #fff; }
  .phone { width: 390px; height: 700px; border-radius: 44px; overflow: hidden;
           background: #0b0d0c; box-shadow: 0 0 0 10px #000, 0 20px 60px #0008;
           display: flex; flex-direction: column; }
  .sheet { flex: 1; padding: 28px 20px 0; display: flex; flex-direction: column; min-height: 0; }
  .eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--gray); }
  h1 { margin: 2px 0 14px; font-size: 26px; }
  .legend { color: var(--gray); font-size: 15px; text-align: center; margin-bottom: 12px; white-space: pre; }
  .stack { position: relative; flex: 1; min-height: 0; margin-bottom: 14px; }
  .card { position: absolute; inset: 0; border-radius: 22px; background: #2b2b2e; overflow: hidden;
          display: flex; flex-direction: column; touch-action: none; user-select: none; cursor: grab;
          transition: transform .25s ease, opacity .25s ease; }
  .card.behind { transform: scale(.94) translateY(12px); opacity: .6; }
  .photo { flex: 1; min-height: 0; background: linear-gradient(135deg, #3b4cca, #1b8f8a); background-size: cover; background-position: center; }
  .caption { padding: 14px 16px 18px; }
  .caption b { display: block; font-size: 20px; margin-bottom: 6px; }
  .caption span { color: var(--gray); font-size: 14px; line-height: 1.4; }
  .stamp { position: absolute; top: 18px; padding: 4px 12px; border: 3px solid; border-radius: 10px;
           font-weight: 800; font-size: 26px; opacity: 0; }
  .stamp.nah { left: 16px; color: #ff5a5f; transform: rotate(-12deg); }
  .stamp.yeah { right: 16px; color: #3ddc84; transform: rotate(12deg); }
  .stamp.meh { left: 50%; margin-left: -30px; color: #ffc233; }
  .done { place-self: center; text-align: center; color: var(--gray); }
  .send { margin: 0 14px 28px; padding: 16px; border: 0; border-radius: 999px; background: var(--blue);
          color: #fff; font-size: 18px; font-weight: 600; }
  .result { max-width: 390px; margin-top: 16px; color: #cbd5e1; font: 13px ui-monospace, monospace; }
  .layout { display: none; }
</style>
</head>
<body>
<div>
  <div class="phone"><div class="sheet" id="sheet"></div><button class="send" id="send"></button></div>
  <div class="result" id="result">Drag a card (or press ← ↑ →). Nothing is sent from here.</div>
</div>
<script>
const layout = __LAYOUT_JSON__;
const SWIPE_DISTANCE = 90;
const sheet = document.getElementById("sheet");
const picks = [];

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text) node.textContent = text;
  return node;
}

sheet.append(el("div", "eyebrow", layout.subtitle), el("h1", "", layout.title));
for (const node of layout.root.children) {
  if (node.type === "text") sheet.append(el("div", "legend", node.text));
  if (node.type === "swipeDeck") sheet.append(renderSwipeDeck(node));
}
const sendAction = layout.actions[0];
const sendButton = document.getElementById("send");
sendButton.textContent = sendAction.label;
sendButton.onclick = () => {
  const lead = decodeURIComponent(new URL(sendAction.deepLinkURL.replace("hermesshare:", "http:")).searchParams.get("lead"));
  document.getElementById("result").textContent = `${lead} ${picks.join(" · ")}`;
};

function renderSwipeDeck(deck) {
  const stack = el("div", "stack");
  let position = 0;
  let isSwiping = false;
  const choiceByDirection = Object.fromEntries(deck.choices.map(c => [c.swipeDirection, c]));

  function draw() {
    stack.replaceChildren();
    if (position >= deck.cards.length) {
      stack.append(el("div", "done", "That's all of them. Send your picks."));
      return;
    }
    for (const index of [position + 1, position]) {
      if (index < deck.cards.length) stack.append(renderCard(deck.cards[index], index === position));
    }
  }

  function renderCard(card, isTop) {
    const node = el("div", isTop ? "card" : "card behind");
    const photo = el("div", "photo");
    if (card.imageUrl) photo.style.backgroundImage = `url("${card.imageUrl}")`;
    const caption = el("div", "caption");
    caption.append(el("b", "", card.title), el("span", "", card.subtitle));
    const stamps = { left: el("div", "stamp nah", "NAH"), up: el("div", "stamp meh", "MEH"), right: el("div", "stamp yeah", "YEAH") };
    node.append(photo, caption, ...Object.values(stamps));
    if (isTop) enableDrag(node, card, stamps);
    return node;
  }

  function directionOf(dx, dy) {
    if (Math.abs(dx) >= Math.abs(dy)) return dx > 0 ? "right" : "left";
    return dy < 0 ? "up" : null;
  }

  function enableDrag(node, card, stamps) {
    let startX, startY;
    node.onpointerdown = e => { startX = e.clientX; startY = e.clientY; node.setPointerCapture(e.pointerId); node.style.transition = "none"; };
    node.onpointermove = e => {
      if (startX === undefined) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      node.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx / 20}deg)`;
      const direction = directionOf(dx, dy);
      for (const [d, stamp] of Object.entries(stamps)) stamp.style.opacity = d === direction ? Math.min(1, Math.hypot(dx, dy) / SWIPE_DISTANCE) : 0;
    };
    node.onpointerup = e => {
      const dx = e.clientX - startX, dy = e.clientY - startY;
      startX = undefined;
      const direction = directionOf(dx, dy);
      if (direction && Math.hypot(dx, dy) > SWIPE_DISTANCE) return swipe(node, card, direction);
      node.style.transition = ""; node.style.transform = "";
      Object.values(stamps).forEach(s => s.style.opacity = 0);
    };
  }

  function swipe(node, card, direction) {
    if (isSwiping) return;
    isSwiping = true;
    const offsets = { left: [-500, 0], right: [500, 0], up: [0, -700] }[direction];
    node.style.transition = "transform .25s ease, opacity .25s ease";
    node.style.transform = `translate(${offsets[0]}px, ${offsets[1]}px)`;
    node.style.opacity = 0;
    const choice = choiceByDirection[direction];
    picks.push(`${card.title} ${choice.id}`);
    position += 1;
    setTimeout(() => { isSwiping = false; draw(); }, 220);
  }

  document.addEventListener("keydown", e => {
    const direction = { ArrowLeft: "left", ArrowUp: "up", ArrowRight: "right" }[e.key];
    const top = stack.querySelector(".card:not(.behind)");
    if (direction && top) swipe(top, deck.cards[position], direction);
  });
  draw();
  return stack;
}
</script>
</body>
</html>
