<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>scout: trips that make it out of the group chat</title>
    <meta
      name="description"
      content="scout is an AI trip planner you add to your group text. It gets you from “we should go somewhere” to an actual trip."

      property="og:description"

    />

  <body>
    <div id="root"></div>

    <!-- Netlify finds forms by reading the built HTML, and the form people
         use is drawn by React, so this hidden copy tells Netlify which
         fields a "join" submission carries. -->
    <form name="join" data-netlify="true" hidden>
      <input name="name" />
      <input name="phone" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
